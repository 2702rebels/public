name: Sync projects

on:
  schedule:
    - cron: "17 8 * * *" # daily, about 3-4am Eastern
  workflow_dispatch:
    inputs:
      only:
        description: Sync just this project folder (leave blank for all)
        required: false
  push:
    branches: [main]
    paths:
      - sources.yml
      - scripts/**
      - .github/workflows/sync.yml

# Never add pull_request triggers here: this job holds a key that can read private repos.

permissions:
  contents: write # create releases; commits are pushed with the deploy key

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The deploy key lets the sync push to main past the review rule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Install Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes -r scripts/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: List source repos
        id: repos
        run: echo "list=$(python3 scripts/sync.py --list-repos)" >> "$GITHUB_OUTPUT"

      # Read-only token limited to exactly the repos in sources.yml.
      - name: Get read token for source repos
        id: token
        if: steps.repos.outputs.list != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: read

      - name: Install gitleaks
        run: |
          v=8.30.1
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C /usr/local/bin gitleaks

      - name: Sync
        if: steps.repos.outputs.list != ''
        env:
          SOURCE_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/sync.py --require-scan --push --releases ${ONLY:+--only "$ONLY"}
